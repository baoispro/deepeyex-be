basePath: /
definitions:
  appointment.Appointment:
    properties:
      appointment_code:
        description: Mã lịch hẹn duy nhất
        type: string
      appointment_id:
        type: string
      checked_in_at:
        description: Thời gian bệnh nhân check-in (nếu có)
        type: string
      created_at:
        type: string
      doctor_id:
        description: ID bác sĩ
        type: string
      hospital_id:
        description: ID bệnh viện
        type: string
      notes:
        description: Ghi chú thêm từ bệnh nhân
        type: string
      patient:
        $ref: '#/definitions/patient.Patient'
      patient_id:
        description: ID bệnh nhân
        type: string
      slot_id:
        description: ID của khung giờ đã chọn
        type: string
      specialty:
        allOf:
        - $ref: '#/definitions/enums.Specialty'
        description: Chuyên khoa
      status:
        $ref: '#/definitions/enums.AppointmentStatus'
      timeSlot:
        allOf:
        - $ref: '#/definitions/appointment.TimeSlot'
        description: Quan hệ
      updated_at:
        type: string
    type: object
  appointment.TimeSlot:
    properties:
      capacity:
        type: integer
      created_at:
        type: string
      doctor:
        $ref: '#/definitions/doctor.Doctor'
      doctor_id:
        type: string
      end_time:
        type: string
      slot_id:
        type: string
      start_time:
        type: string
      updated_at:
        type: string
    type: object
  appointmenthandler.UpdateAppointmentStatusRequest:
    properties:
      status:
        $ref: '#/definitions/enums.AppointmentStatus'
    required:
    - status
    type: object
  appointmenthandler.createAppointmentReq:
    properties:
      doctor_id:
        type: string
      hospital_id:
        type: string
      notes:
        type: string
      patient_id:
        type: string
      slot_id:
        type: string
      specialty:
        $ref: '#/definitions/enums.Specialty'
    required:
    - doctor_id
    - hospital_id
    - patient_id
    - slot_id
    - specialty
    type: object
  appointmenthandler.createTimeSlotReq:
    properties:
      capacity:
        type: integer
      doctor_id:
        type: string
      end_time:
        type: string
      start_time:
        type: string
    required:
    - capacity
    - doctor_id
    - end_time
    - start_time
    type: object
  doctor.Doctor:
    properties:
      created_at:
        type: string
      doctor_id:
        type: string
      email:
        type: string
      full_name:
        type: string
      hospital_id:
        type: string
      image:
        type: string
      phone:
        type: string
      specialty:
        $ref: '#/definitions/enums.Specialty'
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  drug.Drug:
    properties:
      created_at:
        type: string
      description:
        type: string
      discount_percent:
        type: number
      drug_id:
        type: string
      image:
        type: string
      name:
        type: string
      price:
        type: number
      sold_quantity:
        type: integer
      stock_quantity:
        type: integer
      updated_at:
        type: string
    type: object
  enums.AppointmentStatus:
    enum:
    - PENDING
    - CONFIRMED
    - COMPLETED
    - CANCELED
    type: string
    x-enum-varnames:
    - Pending
    - Confirmed
    - Completed
    - Canceled
  enums.Gender:
    enum:
    - male
    - female
    type: string
    x-enum-varnames:
    - Male
    - Female
  enums.OrderStatus:
    enum:
    - PENDING
    - PAID
    - CANCELED
    - DELIVERED
    type: string
    x-enum-varnames:
    - PENDING
    - PAID
    - CANCELED
    - DELIVERED
  enums.Specialty:
    enum:
    - ophthalmology
    - internal_medicine
    - neurology
    - endocrinology
    - pediatrics
    type: string
    x-enum-varnames:
    - SpecialtyOphthalmology
    - SpecialtyInternalMedicine
    - SpecialtyNeurology
    - SpecialtyEndocrinology
    - SpecialtyPediatrics
  hospital.Hospital:
    properties:
      address:
        type: string
      created_at:
        type: string
      doctors:
        items:
          $ref: '#/definitions/doctor.Doctor'
        type: array
      email:
        type: string
      hospital_id:
        type: string
      image:
        type: string
      name:
        type: string
      phone:
        type: string
      updated_at:
        type: string
    type: object
  order.Order:
    properties:
      created_at:
        type: string
      order_id:
        type: string
      order_items:
        items:
          $ref: '#/definitions/order.OrderItem'
        type: array
      patient:
        $ref: '#/definitions/patient.Patient'
      patient_id:
        type: string
      status:
        $ref: '#/definitions/enums.OrderStatus'
      total_amount:
        type: number
    type: object
  order.OrderItem:
    properties:
      drug:
        allOf:
        - $ref: '#/definitions/drug.Drug'
        description: <-- thêm references
      drug_id:
        type: string
      order_id:
        type: string
      order_item_id:
        type: string
      price:
        type: number
      quantity:
        type: integer
    type: object
  orderhandler.CreateOrderRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/orderservice.OrderItemRequest'
        type: array
      patient_id:
        type: string
    required:
    - items
    - patient_id
    type: object
  orderhandler.UpdateOrderStatusRequest:
    properties:
      status:
        $ref: '#/definitions/enums.OrderStatus'
    required:
    - status
    type: object
  orderservice.OrderItemRequest:
    properties:
      drug_id:
        type: string
      quantity:
        type: integer
    required:
    - drug_id
    - quantity
    type: object
  patient.Patient:
    properties:
      address:
        type: string
      created_at:
        type: string
      dob:
        type: string
      email:
        type: string
      full_name:
        type: string
      gender:
        $ref: '#/definitions/enums.Gender'
      image:
        type: string
      patient_id:
        type: string
      phone:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  utils.APIResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: integer
    type: object
host: localhost:8081
info:
  contact: {}
  title: Auth Service API
  version: "1.0"
paths:
  /appointments:
    get:
      description: Retrieve a list of all appointments in the system
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/appointment.Appointment'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all appointments
      tags:
      - Appointments
    post:
      consumes:
      - application/json
      description: Schedule a new appointment for a patient with a doctor
      parameters:
      - description: Appointment data
        in: body
        name: appointment
        required: true
        schema:
          $ref: '#/definitions/appointmenthandler.createAppointmentReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/appointment.Appointment'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new appointment
      tags:
      - Appointments
  /appointments/{appointment_id}:
    delete:
      description: Remove an appointment by its ID
      parameters:
      - description: Appointment ID
        in: path
        name: appointment_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete an appointment
      tags:
      - Appointments
    get:
      description: Retrieve an appointment record using its ID
      parameters:
      - description: Appointment ID
        in: path
        name: appointment_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appointment.Appointment'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get appointment by ID
      tags:
      - Appointments
  /appointments/{appointment_id}/detail:
    put:
      consumes:
      - application/json
      description: Update the details of an existing appointment (date, notes, etc.)
      parameters:
      - description: Appointment ID
        in: path
        name: appointment_id
        required: true
        type: string
      - description: Updated appointment data
        in: body
        name: appointment
        required: true
        schema:
          $ref: '#/definitions/appointment.Appointment'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update appointment details
      tags:
      - Appointments
  /appointments/{appointment_id}/status:
    put:
      consumes:
      - application/json
      description: Update the status of an appointment (PENDING, CONFIRMED, COMPLETED,
        CANCELED)
      parameters:
      - description: Appointment ID
        in: path
        name: appointment_id
        required: true
        type: string
      - description: New status
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/appointmenthandler.UpdateAppointmentStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update appointment status
      tags:
      - Appointments
  /appointments/doctor/{doctor_id}:
    get:
      description: Retrieve all appointments assigned to a specific doctor
      parameters:
      - description: Doctor ID
        in: path
        name: doctor_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/appointment.Appointment'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get appointments by doctor ID
      tags:
      - Appointments
  /appointments/patient/{patient_id}:
    get:
      description: Retrieve all appointments belonging to a specific patient
      parameters:
      - description: Patient ID
        in: path
        name: patient_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/appointment.Appointment'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get appointments by patient ID
      tags:
      - Appointments
  /doctors:
    get:
      description: Retrieve all doctors
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/doctor.Doctor'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all doctors
      tags:
      - Doctors
    post:
      consumes:
      - multipart/form-data
      description: Add a doctor with required info and optional avatar upload
      parameters:
      - description: User ID
        in: formData
        name: user_id
        required: true
        type: string
      - description: Full Name
        in: formData
        name: full_name
        required: true
        type: string
      - description: Specialty
        in: formData
        name: specialty
        required: true
        type: string
      - description: Hospital ID
        in: formData
        name: hospital_id
        required: true
        type: string
      - description: Phone
        in: formData
        name: phone
        type: string
      - description: Email
        in: formData
        name: email
        type: string
      - description: Avatar File
        in: formData
        name: avatar
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Create a new doctor
      tags:
      - Doctors
  /doctors/{doctor_id}:
    delete:
      description: Delete doctor by doctor ID
      parameters:
      - description: Doctor ID
        in: path
        name: doctor_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete doctor
      tags:
      - Doctors
    get:
      description: Retrieve doctor record using doctor ID
      parameters:
      - description: Doctor ID
        in: path
        name: doctor_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/doctor.Doctor'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get doctor by doctor ID
      tags:
      - Doctors
    put:
      consumes:
      - multipart/form-data
      description: Update doctor info and avatar
      parameters:
      - description: Doctor ID
        in: path
        name: doctor_id
        required: true
        type: string
      - description: Full Name
        in: formData
        name: full_name
        type: string
      - description: Specialty
        in: formData
        name: specialty
        type: string
      - description: Hospital ID
        in: formData
        name: hospital_id
        type: string
      - description: Phone
        in: formData
        name: phone
        type: string
      - description: Email
        in: formData
        name: email
        type: string
      - description: Avatar File
        in: formData
        name: avatar
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Update a doctor
      tags:
      - Doctors
  /doctors/hospital/{hospital_id}:
    get:
      description: Retrieve doctors for a specific hospital
      parameters:
      - description: Hospital ID
        in: path
        name: hospital_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/doctor.Doctor'
            type: array
        "500":
