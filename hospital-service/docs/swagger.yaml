    put:
      consumes:
      - multipart/form-data
      description: Update drug record by ID (with optional image)
      parameters:
      - description: Drug ID
        in: path
        name: drug_id
        required: true
        type: string
      - description: Drug name
        in: formData
        name: name
        type: string
      - description: Description
        in: formData
        name: description
        type: string
      - description: Price
        in: formData
        name: price
        type: number
      - description: Stock quantity
        in: formData
        name: stock
        type: integer
      - description: Discount percent
        in: formData
        name: discount
        type: number
      - description: Drug image
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/drug.Drug'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update drug info
      tags:
      - Drugs
  /hospitals:
    get:
      description: Retrieve all hospitals
      produces:
