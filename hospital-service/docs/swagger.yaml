      description: Update hospital info and logo
      parameters:
      - description: Hospital ID
        in: path
        name: hospital_id
        required: true
        type: string
      - description: Hospital Name
        in: formData
        name: name
        type: string
      - description: Address
        in: formData
        name: address
        type: string
      - description: Phone
        in: formData
        name: phone
        type: string
      - description: Email
        in: formData
        name: email
        type: string
      - description: Hospital Logo
        in: formData
        name: logo
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
