          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all drugs
      tags:
      - Drugs
    post:
      consumes:
      - multipart/form-data
      description: Add a new drug record with optional image upload
      parameters:
      - description: Drug name
        in: formData
        name: name
        required: true
        type: string
      - description: Description
        in: formData
        name: description
        type: string
      - description: Price
        in: formData
        name: price
        required: true
        type: number
      - description: Stock quantity
        in: formData
        name: stock
        required: true
        type: integer
      - description: Discount percent
        in: formData
        name: discount
        type: number
      - description: Drug image
        in: formData
