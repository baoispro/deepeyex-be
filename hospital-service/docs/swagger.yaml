basePath: /
definitions:
  doctor.Doctor:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      doctor_id:
        type: string
      email:
        type: string
      full_name:
        type: string
      hospital_id:
        type: string
      phone:
        type: string
      specialty:
        $ref: '#/definitions/enums.Specialty'
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  enums.Gender:
    enum:
    - male
    - female
    type: string
    x-enum-varnames:
    - Male
    - Female
  enums.Specialty:
    enum:
    - ophthalmology
    - internal_medicine
    - neurology
    - endocrinology
    - pediatrics
    type: string
    x-enum-varnames:
    - SpecialtyOphthalmology
    - SpecialtyInternalMedicine
    - SpecialtyNeurology
    - SpecialtyEndocrinology
    - SpecialtyPediatrics
  hospital.Hospital:
    properties:
      address:
        type: string
      created_at:
        type: string
      doctors:
        items:
          $ref: '#/definitions/doctor.Doctor'
        type: array
      email:
        type: string
      hospital_id:
        type: string
      logo_url:
        type: string
      name:
        type: string
      phone:
        type: string
      updated_at:
        type: string
    type: object
  patient.Patient:
    properties:
      address:
        type: string
      avatar_url:
        type: string
      created_at:
        type: string
      dob:
        type: string
      email:
        type: string
      full_name:
        type: string
      gender:
        $ref: '#/definitions/enums.Gender'
      patient_id:
        type: string
      phone:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  utils.APIResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: integer
    type: object
