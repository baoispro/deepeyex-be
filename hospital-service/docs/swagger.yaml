          schema:
            additionalProperties:
              type: string
            type: object
      summary: List doctors by hospital ID
      tags:
      - Doctors
  /doctors/user/{user_id}:
    get:
      description: Retrieve doctor record using user ID
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/doctor.Doctor'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get doctor by user ID
      tags:
      - Doctors
  /drugs:
    get:
      description: Retrieve all drugs
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/drug.Drug'
            type: array
        "500":
