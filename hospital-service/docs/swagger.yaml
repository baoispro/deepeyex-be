  /drugs/{drug_id}:
    delete:
      description: Delete drug by ID
      parameters:
      - description: Drug ID
        in: path
        name: drug_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete drug
      tags:
