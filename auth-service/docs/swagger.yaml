basePath: /
definitions:
  enums.Role:
    enum:
    - patient
    - doctor
    - admin
    type: string
    x-enum-varnames:
    - Patient
    - Doctor
    - Admin
  handlers.loginFirebaseReq:
    properties:
      email:
        type: string
      firebase_uid:
        type: string
    required:
    - email
    - firebase_uid
    type: object
  handlers.loginReq:
    properties:
      password:
        example: secret
        type: string
      username:
        example: alice
        type: string
    required:
    - password
    - username
    type: object
  handlers.registerReq:
    properties:
      password:
        example: secret
        type: string
      role:
        allOf:
        - $ref: '#/definitions/enums.Role'
        example: patient
      username:
        example: alice
        type: string
    required:
    - password
    - role
    - username
    type: object
  handlers.tokenRes:
    properties:
      access_expire:
        type: string
      access_token:
        type: string
      role:
        type: string
      user_id:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  title: Auth Service API
  version: "1.0"
paths:
  /private/me:
    get:
      description: Return user ID and role from JWT claims
      produces:
      - application/json
      responses:
        "200":
          description: User info
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user info
      tags:
      - Private
  /public/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access/refresh tokens
      parameters:
      - description: Login request
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/handlers.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.tokenRes'
        "401":
          description: Invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - Public
  /public/login/firebase:
    post:
      consumes:
      - application/json
      description: Authenticate user using Firebase UID & email, then return access/refresh
        tokens
      parameters:
      - description: Firebase login request
        in: body
        name: loginFirebase
        required: true
        schema:
          $ref: '#/definitions/handlers.loginFirebaseReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.tokenRes'
        "401":
          description: Invalid firebase payload or login failed
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login with Firebase
      tags:
      - Public
  /public/logout:
    post:
      description: Clear refresh cookie and invalidate refresh token
      produces:
      - application/json
      responses:
        "200":
          description: Logged out
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout user
      tags:
      - Public
  /public/refresh:
    post:
      description: Generate new access token using refresh cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.tokenRes'
        "401":
          description: Missing or invalid refresh token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - Public
  /public/register:
    post:
      consumes:
      - application/json
      description: Create a new account
      parameters:
      - description: Register request
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/handlers.registerReq'
      produces:
      - application/json
      responses:
        "201":
          description: User registered
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid payload or registration failed
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Public
swagger: "2.0"
