basePath: /
definitions:
  handlers.createUserReq:
    properties:
      email:
        example: alice@example.com
        type: string
      firebase_uid:
        description: optional
        example: ""
        type: string
      password:
        example: secret
        type: string
      role:
        description: patient/doctor/admin
        example: patient
        type: string
      username:
        example: alice
        type: string
    required:
    - email
    - password
    - role
    - username
    type: object
  handlers.loginFirebaseReq:
    properties:
      email:
        type: string
      firebase_uid:
        type: string
    required:
    - email
    - firebase_uid
    type: object
  handlers.loginReq:
    properties:
      password:
        example: secret
        type: string
      username:
        example: alice
        type: string
    required:
    - password
    - username
    type: object
  handlers.logoutReq:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handlers.refreshReq:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handlers.registerReq:
    properties:
      email:
        example: nguyena@gmail.com
        type: string
      firebase_uid:
        example: abc123xyz
        type: string
      password:
        example: secret
        type: string
      username:
        example: alice
        type: string
    required:
    - email
    - firebase_uid
    - password
    - username
    type: object
  handlers.resetPasswordReq:
    properties:
      email:
        example: alice@example.com
        type: string
      password:
        example: newsecret
        type: string
    required:
    - email
    - password
    type: object
  handlers.tokenRes:
    properties:
      access_expire:
        type: string
      access_token:
        type: string
      role:
        type: string
      user_id:
        type: string
    type: object
  handlers.updateUserReq:
    properties:
      email:
        example: alice@example.com
        type: string
      firebase_uid:
        description: optional
        example: ""
        type: string
      password:
        example: newsecret
        type: string
      role:
        description: patient/doctor/admin
        example: patient
        type: string
      username:
        example: alice
        type: string
    type: object
  utils.APIResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  title: Auth Service API
  version: "1.0"
paths:
  /private/me:
    get:
      description: Return user ID and role from JWT claims
      produces:
      - application/json
      responses:
        "200":
          description: User info
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user info
      tags:
      - Private
  /private/users:
    get:
      parameters:
      - description: Filter by username (partial match)
        in: query
        name: name
        type: string
      - description: 'Filter by role (exact match: patient/doctor/admin)'
        in: query
        name: role
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: List users
      tags:
      - Users
    post:
      consumes:
      - application/json
      parameters:
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/handlers.createUserReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Create user
      tags:
      - Users
  /private/users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Delete user
      tags:
      - Users
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Get user
      tags:
      - Users
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: User updates
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/handlers.updateUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Update user
      tags:
      - Users
  /public/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access/refresh tokens
      parameters:
      - description: Login request
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/handlers.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.tokenRes'
        "401":
          description: Invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - Public
  /public/login/firebase:
    post:
      consumes:
      - application/json
      description: Authenticate user using Firebase UID & email, then return access/refresh
        tokens
      parameters:
      - description: Firebase login request
        in: body
        name: loginFirebase
        required: true
        schema:
          $ref: '#/definitions/handlers.loginFirebaseReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.tokenRes'
        "401":
          description: Invalid firebase payload or login failed
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login with Firebase
      tags:
      - Public
  /public/logout:
    post:
      description: Clear refresh cookie and invalidate refresh token
      produces:
      - application/json
      responses:
        "200":
          description: Logged out
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout user
      tags:
      - Public
  /public/mobile/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access & refresh tokens in JSON (no
        cookies)
      parameters:
      - description: Login request
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/handlers.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login for mobile app
      tags:
      - Mobile
  /public/mobile/login/firebase:
    post:
      consumes:
      - application/json
      description: Authenticate user using Firebase UID & email, return access & refresh
        tokens in JSON (no cookies)
      parameters:
      - description: Firebase login request
        in: body
        name: loginFirebase
        required: true
        schema:
          $ref: '#/definitions/handlers.loginFirebaseReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid firebase payload or login failed
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login with Firebase (Mobile)
      tags:
      - Mobile
  /public/mobile/logout:
    post:
      consumes:
      - application/json
      description: Invalidate refresh token sent from body
      parameters:
      - description: Logout request
        in: body
        name: logout
        required: true
        schema:
          $ref: '#/definitions/handlers.logoutReq'
      produces:
      - application/json
      responses:
        "200":
          description: Logged out
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout for mobile
      tags:
      - Mobile
  /public/mobile/refresh:
    post:
      consumes:
      - application/json
      description: Generate a new access token using refresh token from body
      parameters:
      - description: Refresh token request
        in: body
        name: refresh
        required: true
        schema:
          $ref: '#/definitions/handlers.refreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or expired refresh token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh token for mobile
      tags:
      - Mobile
  /public/refresh:
    post:
      description: Generate new access token using refresh cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.tokenRes'
        "401":
          description: Missing or invalid refresh token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - Public
  /public/register:
    post:
      consumes:
      - application/json
      description: Create a new account
      parameters:
      - description: Register request
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/handlers.registerReq'
      produces:
      - application/json
      responses:
        "201":
          description: User registered
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid payload or registration failed
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Public
  /public/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.resetPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Update password by email
      tags:
      - Users
swagger: "2.0"
